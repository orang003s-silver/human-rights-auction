<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가치 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#3d5164;
    --paper:#f5efe0;
    --paper-dark:#eadfc4;
    --card:#faf6ea;
    --gold:#b8873b;
    --gold-light:#d9ad6a;
    --gold-dark:#8f6526;
    --seal:#8a3324;
    --line:#c9bd9e;
    --green:#4a6b4d;
    --shadow: 0 1px 0 rgba(28,43,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fffdf6 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 18px 60px;min-height:100vh;}
  h1,h2,h3{font-family:'Noto Serif KR', serif; margin:0; color:var(--ink); font-weight:700;}
  .eyebrow{font-family:'Noto Sans KR',sans-serif; font-size:12.5px; letter-spacing:0.02em; color:var(--ink-soft); margin:0 0 6px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:'Noto Sans KR',sans-serif;
    font-size:15px; font-weight:700; cursor:pointer;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:13px 20px; border-radius:3px; transition:transform .08s ease, opacity .15s ease;
    text-align:center;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--ink);}
  .btn.gold{background:var(--gold); border-color:var(--gold-dark); color:#fff8ea;}
  .btn.gold:hover{background:var(--gold-dark);}
  .btn.seal{background:var(--seal); border-color:#5e2117; color:#fff1ec;}
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn.block{width:100%;}
  input[type=text],input[type=number],textarea{
    font-family:'Noto Sans KR',sans-serif; font-size:16px;
    border:1.5px solid var(--line); background:#fffef9;
    padding:12px 13px; border-radius:3px; color:var(--ink); width:100%;
  }
  input:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}
  label.field-label{font-size:13px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:5px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:20px; box-shadow:var(--shadow);
  }
  .center{text-align:center;}
  .muted{color:var(--ink-soft); font-size:14px; line-height:1.55;}
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:30px;
    letter-spacing:0.14em; color:var(--ink); background:#fffef9;
    border:2px solid var(--gold); border-radius:50%;
    width:118px; height:118px; margin:0 auto;
  }
  .home-hero{text-align:center; padding:36px 4px 8px;}
  .home-hero h1{font-size:34px; margin-bottom:10px;}
  .home-hero p{color:var(--ink-soft); font-size:15px; max-width:420px; margin:0 auto;}
  .choice-card{
    border:1.5px solid var(--ink); border-radius:4px; padding:22px; cursor:pointer;
    background:var(--card); transition:background .15s;
  }
  .choice-card:hover{background:var(--paper-dark);}
  .choice-card h3{font-size:19px; margin-bottom:4px;}
  .choice-card p{margin:0; font-size:13.5px; color:var(--ink-soft);}
  .item-row{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line);
    border-radius:3px; padding:12px; background:#fffef9;
  }
  .item-num{
    font-family:'Noto Serif KR',serif; font-weight:700; color:var(--gold-dark);
    font-size:15px; min-width:22px; padding-top:2px;
  }
  .item-fields{flex:1; display:flex; flex-direction:column; gap:6px;}
  .item-fields input{font-size:14px; padding:8px 10px;}
  .item-fields textarea{font-size:13px; padding:8px 10px; resize:vertical; min-height:38px;}
  .remove-x{background:none; border:none; color:var(--seal); cursor:pointer; font-size:18px; padding:2px 6px;}
  .pill{
    display:inline-block; font-size:12px; font-weight:700; padding:3px 10px;
    border-radius:20px; border:1px solid var(--line); color:var(--ink-soft);
  }
  .pill.wait{border-color:var(--gold); color:var(--gold-dark);}
  .pill.ok{border-color:var(--green); color:var(--green);}
  .pill.no{border-color:var(--seal); color:var(--seal);}
  .list-plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .participant{display:flex; justify-content:space-between; align-items:center; font-size:14.5px; padding:8px 10px; background:#fffef9; border:1px solid var(--line); border-radius:3px;}
  .proposal-card{border:1px solid var(--line); border-radius:3px; padding:12px; background:#fffef9;}
  .proposal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .linkbtn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .auction-stage{border:2px solid var(--ink); border-radius:5px; padding:24px 20px; text-align:center; background:var(--card);}
  .auction-stage .value-name{font-size:26px; margin-bottom:6px;}
  .auction-stage .value-desc{color:var(--ink-soft); font-size:14.5px; line-height:1.6; margin-bottom:16px;}
  .bid-display{
    background:var(--ink); color:var(--paper); border-radius:4px; padding:18px;
    display:flex; justify-content:space-between; align-items:center; margin:14px 0;
  }
  .bid-display .amt{font-family:'Noto Serif KR',serif; font-size:32px; font-weight:700; color:var(--gold-light);}
  .bid-display .who{font-size:13px; opacity:.85;}
  .bid-quick{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0;}
  .budget-strip{
    display:flex; justify-content:space-between; align-items:center; font-size:13.5px;
    background:var(--paper-dark); border-radius:3px; padding:9px 13px; margin-bottom:14px;
  }
  .budget-strip b{font-family:'Noto Serif KR',serif; font-size:16px; color:var(--gold-dark);}
  .history-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line); color:var(--ink-soft);}
  table.results{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.results th, table.results td{border-bottom:1px solid var(--line); padding:9px 6px; text-align:left;}
  table.results th{font-family:'Noto Serif KR',serif; color:var(--ink-soft); font-weight:700; font-size:12.5px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:4px;
    font-size:13.5px; z-index:50; max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .footer-note{margin-top:26px; text-align:center; font-size:12px; color:var(--ink-soft); opacity:.7;}
  .celebrate-wrap{position:relative; text-align:center; padding:18px 0 6px;}
  .celebrate-wrap h2{font-size:28px; margin-bottom:6px;}
  .celebrate-wrap p{color:var(--ink-soft); font-size:14.5px;}
  .stat-row{display:flex; gap:10px; margin:16px 0;}
  .stat-box{flex:1; text-align:center; background:var(--paper-dark); border-radius:4px; padding:12px 8px;}
  .stat-box .num{font-family:'Noto Serif KR',serif; font-size:22px; font-weight:700; color:var(--gold-dark);}
  .stat-box .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
</style>

<body>

<div id="app">
  <div class="center" style="padding: 80px 20px;">
    <h2 style="font-size: 22px; margin-bottom: 8px;">화면을 불러오는 중입니다...</h2>
    <p class="muted">잠시만 기다려 주세요.</p>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyBj5JyhfmNCjk9n6HSAPIkF_gbDLxi6yiE",
      authDomain: "humanrigthts-auction.firebaseapp.com",
      projectId: "humanrigthts-auction",
      storageBucket: "humanrigthts-auction.firebasestorage.app",
      messagingSenderId: "898677950362",
      appId: "1:898677950362:web:f75862b72547449ff35c23"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
    function roomCodeGen(){ return String(Math.floor(1000 + Math.random()*9000)); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    let toastTimer=null;
    function toast(msg){
      let t = document.getElementById('toast');
      if(!t){
        t = document.createElement('div');
        t.id='toast'; t.className='toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.display='block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
    }

    // 기본 가치 30종 전체 목록
    const DEFAULT_VALUES = [
      {name:'생명권', desc:'모든 사람은 생명을 존중받고 안전하게 살아갈 권리가 있다', price:50},
      {name:'자유권', desc:'자신의 생각과 행동을 스스로 결정할 자유', price:50},
      {name:'평등권', desc:'성별, 신분, 인종에 관계없이 동등하게 대우받을 권리', price:50},
      {name:'행복추구권', desc:'자신이 원하는 삶의 방식으로 행복을 추구할 권리', price:50},
      {name:'교육받을 권리', desc:'배우고 성장할 기회를 보장받을 권리', price:50},
      {name:'사생활의 자유', desc:'개인의 사적인 영역을 존중받을 권리', price:50},
      {name:'표현의 자유', desc:'자신의 생각을 자유롭게 말하고 표현할 권리', price:50},
      {name:'노동의 권리', desc:'정당한 대가를 받으며 안전하게 일할 권리', price:50},
      {name:'참정권', desc:'정치에 참여하고 투표할 권리', price:50},
      {name:'안전하게 살 권리', desc:'폭력과 위험으로부터 보호받을 권리', price:50},
      {name:'환경권', desc:'깨끗하고 쾌적한 환경에서 건강하게 살아갈 권리', price:50},
      {name:'문화를 누릴 권리', desc:'다양한 문화와 예술을 자유롭게 즐길 권리', price:50},
      {name:'재산권', desc:'자신의 재산을 정당하게 갖고 지킬 권리', price:50},
      {name:'신체의 자유', desc:'부당하게 구속되거나 신체적 침해를 당하지 않을 권리', price:50},
      {name:'양심과 종교의 자유', desc:'자신의 신념과 믿음을 지키고 표현할 권리', price:50},
      {name:'휴식과 여가의 권리', desc:'충분히 쉬고 재충전할 여유를 가질 권리', price:50},
      {name:'가족을 구성할 권리', desc:'원하는 사람과 가정을 이루고 보호받을 권리', price:50},
      {name:'도움을 요청할 권리', desc:'위기와 어려움에 처했을 때 사회적 구호를 받을 권리', price:50},
      {name:'이동의 자유', desc:'자신이 원하는 곳으로 자유롭게 이동하고 거주할 권리', price:50},
      {name:'비밀보장의 권리', desc:'통신과 편지의 비밀을 침해받지 않을 권리', price:50},
      {name:'차별받지 않을 권리', desc:'성별, 장애, 인종 등 어떤 이유로도 부당한 불이익을 받지 않을 권리', price:50},
      {name:'디지털 잊힐 권리', desc:'온라인 공간에서 원치 않는 개인정보나 기록의 삭제를 요구할 권리', price:50},
      {name:'공정한 재판을 받을 권리', desc:'법 앞에서 편견 없이 공정하고 객관적인 재판을 보장받을 권리', price:50},
      {name:'건강 및 의료권', desc:'질병이나 부상 시 차별 없이 적절한 의료 서비스와 돌봄을 받을 권리', price:50},
      {name:'문화적 다양성 존중권', desc:'고유한 문화, 언어, 예술을 자유롭게 표현하고 인정받을 권리', price:50},
      {name:'집회 및 결사의 자유', desc:'같은 뜻을 가진 사람들과 평화롭게 모이고 단체를 결성할 권리', price:50},
      {name:'아동·청소년 보호권', desc:'모든 형태의 폭력, 학대, 착취로부터 특별한 보호와 돌봄을 받을 권리', price:50},
      {name:'주거권', desc:'비바람을 피하고 인간다운 삶을 누릴 수 있는 안전한 보금자리를 가질 권리', price:50},
      {name:'기후·지속가능권', desc:'미래 세대를 위해 파괴되지 않은 지구 환경을 누릴 권리', price:50},
      {name:'알 권리 (정보 접근권)', desc:'시민으로서 사회의 중요한 공공 정보와 진실을 투명하게 알 권리', price:50}
    ];

    let state = {
      screen:'home',
      role:null,
      roomCode:null,
      studentId:null,
      studentName:'',
      myStudentData: null,
      draftBudget:1000,
      draftMaxProposals: 20,
      draftMaxItems: 3,
      draftItems: DEFAULT_VALUES.map(v=>({id:uid(), name:v.name, desc:v.desc, price:v.price})),
      room:null,
      students:[],
      proposals:[],
      bid:null,
      unsubscribers:[],
      countdownHandle:null,
      webhookUrl:''
    };

    function saveSession() {
      if(state.roomCode && state.role) {
        localStorage.setItem('auction_session', JSON.stringify({
          roomCode: state.roomCode,
          role: state.role,
          studentId: state.studentId || '',
          studentName: state.studentName || ''
        }));
        localStorage.setItem('last_teacher_room_code', state.roomCode);
      }
    }

    function goto(screen){
      state.screen = screen;
      render();
    }

    function cleanupListeners(){
      state.unsubscribers.forEach(u => { try{ u(); }catch(e){} });
      state.unsubscribers = [];
      if(state.countdownHandle){ clearInterval(state.countdownHandle); state.countdownHandle=null; }
    }

    function manageCountdownTicker(status, b){
      if(status !== 'countdown'){
        if(state.countdownHandle){ clearInterval(state.countdownHandle); state.countdownHandle=null; }
        return;
      }
      if(state.countdownHandle) return;
      const tick = () => {
        const el = document.getElementById('countdownNum');
        if(!el || !state.bid || state.bid.status !== 'countdown'){
          clearInterval(state.countdownHandle); state.countdownHandle=null; return;
        }
        const remainingMs = (state.bid.countdownEndAt || 0) - Date.now();
        const secs = Math.max(0, Math.ceil(remainingMs/1000));
        el.textContent = secs;
      };
      tick();
      state.countdownHandle = setInterval(tick, 200);
    }

    /* ================= REALTIME SYNC ================= */
    function bindRoomRealtime(code){
      cleanupListeners();

      const unsubRoom = db.collection("rooms").doc(code).onSnapshot((snap) => {
        if(!snap.exists) {
          toast("방이 종료되었거나 존재하지 않습니다.");
          goto('home');
          return;
        }
        const newRoom = snap.data();
        const prevStatus = state.room?.status;
        const prevIdx = state.room?.currentIndex;
        state.room = newRoom;
        
        if(newRoom.status === 'auction' && (prevStatus !== 'auction' || prevIdx !== newRoom.currentIndex)){
          bindBidRealtime(code, newRoom.currentIndex);
        }

        if(prevStatus !== newRoom.status || prevIdx !== newRoom.currentIndex){
          render();
        }
      });
      state.unsubscribers.push(unsubRoom);

      const unsubStudents = db.collection("rooms").doc(code).collection("students").orderBy("joinedAt", "asc").onSnapshot((snap) => {
        state.students = snap.docs.map(d => d.data());
        if(state.studentId){
          const me = state.students.find(s => s.id === state.studentId);
          if(me) {
            state.myStudentData = me;
            const bEl = document.getElementById('myBudgetNum');
            if(bEl) bEl.textContent = me.remainingBudget;
          }
        }
        updateStudentsDOM();
      });
      state.unsubscribers.push(unsubStudents);

      const unsubProposals = db.collection("rooms").doc(code).collection("proposals").orderBy("createdAt", "asc").onSnapshot((snap) => {
        state.proposals = snap.docs.map(d => d.data());
        updateProposalsDOM();
      });
      state.unsubscribers.push(unsubProposals);
    }

    function bindBidRealtime(code, idx){
      const unsubBid = db.collection("rooms").doc(code).collection("bids").doc(String(idx)).onSnapshot((snap) => {
        state.bid = snap.exists ? snap.data() : null;
        updateBidDOM();
      });
      state.unsubscribers.push(unsubBid);
    }

    function updateProposalsDOM(){
      if(state.screen === 'student-room' && state.room?.status === 'waiting'){
        const myProposals = state.proposals.filter(p => p.studentId === state.studentId);
        const myPropDiv = document.getElementById('myProposalsList');
        if(myPropDiv){
          myPropDiv.innerHTML = myProposals.length
            ? myProposals.map(p=>`<div class="proposal-card"><div class="proposal-head"><strong>${esc(p.valueName)}</strong><span class="pill ${p.status==='approved'?'ok':p.status==='rejected'?'no':'wait'}">${p.status==='approved'?'채택됨':p.status==='rejected'?'거절됨':'대기중'}</span></div></div>`).join('')
            : `<p class="muted" style="font-size:13px;">아직 제안한 가치가 없어요.</p>`;
        }
      } else if(state.screen === 'teacher-room' && state.room?.status === 'waiting'){
        const pending = state.proposals.filter(p=>p.status==='pending');
        const pCountEl = document.getElementById('teacherProposalCount');
        if(pCountEl) pCountEl.textContent = `${state.proposals.length}/${state.room.maxProposals}`;
        const pListDiv = document.getElementById('teacherProposalList');
        if(pListDiv){
          pListDiv.innerHTML = pending.length
            ? pending.map(p=>`
              <div class="proposal-card">
                <div class="proposal-head"><strong>${esc(p.valueName)}</strong><span class="pill wait">${esc(p.studentName)} 제안</span></div>
                <p class="muted" style="margin:4px 0 8px;">${esc(p.desc || '(설명 없음)')}</p>
                <div class="row">
                  <button class="btn small gold" data-approve="${p.id}">목록에 추가</button>
                  <button class="btn small secondary" data-reject="${p.id}">거절</button>
                </div>
              </div>
            `).join('')
            : `<p class="muted">아직 들어온 제안이 없어요.</p>`;
          attachProposalActionHandlers();
        }
      }
    }

    function updateStudentsDOM(){
      if(state.screen === 'teacher-room' && state.room?.status === 'waiting'){
        const countEl = document.getElementById('teacherStudentCount');
        if(countEl) countEl.textContent = `${state.students.length}명`;
        const listUl = document.getElementById('teacherStudentList');
        if(listUl){
          listUl.innerHTML = state.students.length
            ? state.students.map(s=>`<li class="participant"><span>${esc(s.name)}</span><span class="pill">예산 ${s.remainingBudget}</span></li>`).join('')
            : `<li class="muted" style="list-style:none;">아직 참여한 학생이 없어요.</li>`;
        }
      }
    }

    function updateBidDOM(){
      const r = state.room;
      if(!r || r.status !== 'auction') return;
      const idx = r.currentIndex;
      const item = (r.items && r.items[idx]) ? r.items[idx] : { name:'가치', desc:'', price:50 };
      const b = state.bid;
      const status = b ? b.status : 'open';

      const bidAreaDiv = document.getElementById('bidAreaDiv');
      if(bidAreaDiv) bidAreaDiv.innerHTML = renderBidArea(b, item, status);

      const histDiv = document.getElementById('teacherHistoryDiv');
      if(histDiv && b && b.history){
        histDiv.innerHTML = b.history.length
          ? b.history.slice().reverse().slice(0,8).map(h=>`<div class="history-row"><span>${esc(h.name)}</span><span>${h.amount}</span></div>`).join('')
          : `<p class="muted" style="font-size:13px;">입찰 기록이 없습니다.</p>`;
      }

      manageCountdownTicker(status, b);
    }

    function collectDraftItemsFromDOM(){
      const rows = document.querySelectorAll('#itemsList .item-row');
      if(!rows || rows.length === 0) return state.draftItems;
      const items = [];
      rows.forEach(row=>{
        const id = row.getAttribute('data-item-id') || uid();
        const name = (row.querySelector('.it-name')?.value || '').trim();
        const desc = (row.querySelector('.it-desc')?.value || '').trim();
        const price = parseInt(row.querySelector('.it-price')?.value, 10) || 50;
        if(name) items.push({ id, name, desc, price });
      });
      return items.length ? items : state.draftItems;
    }

    /* ================= RENDER ================= */
    function render(){
      const appEl = document.getElementById('app');
      if(!appEl) return;
      if(state.screen==='home') appEl.innerHTML = renderHome();
      else if(state.screen==='teacher-menu') appEl.innerHTML = renderTeacherMenu();
      else if(state.screen==='teacher-create') appEl.innerHTML = renderTeacherCreate();
      else if(state.screen==='teacher-room') appEl.innerHTML = renderTeacherRoom();
      else if(state.screen==='student-join') appEl.innerHTML = renderStudentJoin();
      else if(state.screen==='student-room') appEl.innerHTML = renderStudentRoom();
      attachHandlers();
    }

    function renderHome(){
      return `
      <div class="home-hero">
        <p class="eyebrow">도덕 수업 · 인권 가치 경매</p>
        <h1>가치 경매</h1>
        <p>한정된 예산으로 인권 가치를 두고 경합합니다.<br>무엇에 얼마의 값을 매길 것인가, 그 선택이 곧 우리의 가치관입니다.</p>
      </div>
      <div class="stack" style="margin-top:26px;">
        <div class="choice-card" data-go="teacher-menu">
          <h3>선생님으로 시작하기</h3>
          <p>새 방을 만들거나, 이전에 만든 방 코드로 즉시 복귀하여 경매를 이어서 진행합니다.</p>
        </div>
        <div class="choice-card" data-go="student-join">
          <h3>학생으로 참여하기</h3>
          <p>선생님이 알려준 방 코드로 입장합니다.</p>
        </div>
      </div>
      <p class="footer-note">각 기기(학생 스마트폰·태블릿)에서 이 화면을 열어 참여하세요.</p>
      `;
    }

    function renderTeacherMenu(){
      const lastCode = localStorage.getItem('last_teacher_room_code') || '';

      return `
      <div class="topbar"><button class="linkbtn" data-go="home">← 처음으로</button></div>
      <h2 style="margin-bottom:6px;">선생님 메뉴</h2>
      <p class="muted" style="margin-bottom:20px;">이어서 진행할 방이 있다면 코드로 입장하거나, 새 방을 만드세요.</p>

      <div class="stack">
        <div class="card stack" style="border:1.5px solid var(--gold);">
          <span class="eyebrow" style="color:var(--gold-dark); font-weight:700;">기존 경매방 이어하기</span>
          <p class="muted" style="font-size:13px; margin:0;">기존 방 코드를 입력하면 대기실 및 경매 상태 그대로 복귀합니다.</p>
          <div class="row" style="margin-top:4px;">
            <input type="text" id="resumeCodeInput" placeholder="방 코드 4자리" maxlength="4" value="${esc(lastCode)}" style="flex:1;">
            <button class="btn gold" id="resumeRoomBtn" style="white-space:nowrap;">방 이어하기</button>
          </div>
          <p id="resumeError" class="muted" style="color:var(--seal); display:none; font-size:12.5px;"></p>
        </div>

        <div class="choice-card" data-go="teacher-create">
          <h3>새 경매방 만들기 (기본 30종 가치)</h3>
          <p>30종의 인권 가치와 학생 제안(최대 20개) 설정으로 새 경매를 시작합니다.</p>
        </div>
      </div>
      `;
    }

    function renderTeacherCreate(){
      const itemsHtml = state.draftItems.map((it, i)=>`
        <div class="item-row" data-item-id="${it.id}">
          <div class="item-num">${i+1}</div>
          <div class="item-fields">
            <input type="text" class="it-name" placeholder="가치 이름" value="${esc(it.name)}">
            <textarea class="it-desc" placeholder="설명">${esc(it.desc)}</textarea>
            <input type="number" class="it-price" placeholder="시작가" value="${it.price}" min="0">
          </div>
          <button class="remove-x" data-remove-item="${it.id}" title="삭제">✕</button>
        </div>
      `).join('');

      return `
      <div class="topbar"><button class="linkbtn" data-go="teacher-menu">← 메뉴로</button></div>
      <h2 style="margin-bottom:4px;">새 경매방 만들기</h2>
      <p class="muted" style="margin-bottom:18px;">학생 예산과 경매에 올릴 가치 목록을 정하세요.</p>

      <div class="card stack">
        <div class="row">
          <div style="flex:1; min-width:130px;">
            <label class="field-label">학생 1인당 시작 예산</label>
            <input type="number" id="budgetInput" value="${state.draftBudget}" min="0">
          </div>
          <div style="flex:1; min-width:130px;">
            <label class="field-label">1인당 최대 낙찰 개수</label>
            <input type="number" id="maxItemsInput" value="${state.draftMaxItems}" min="1">
          </div>
          <div style="flex:1; min-width:130px;">
            <label class="field-label">학생 제안 최대 개수</label>
            <input type="number" id="maxProposalsInput" value="${state.draftMaxProposals}" min="0">
          </div>
        </div>
      </div>

      <div style="margin-top:22px;" class="stack">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h3 style="font-size:16px;">경매 가치 목록 (${state.draftItems.length}개)</h3>
          <button class="btn secondary small" id="resetDefaultsBtn">기본 목록(30종) 재설정</button>
        </div>
        <div id="itemsList" class="stack">${itemsHtml}</div>
        <button class="btn secondary block" id="addItemBtn">+ 가치 항목 추가</button>
      </div>

      <button class="btn gold block" id="createRoomBtn" style="margin-top:24px; font-size:16px; padding:15px;">새 방 만들기 (코드 생성)</button>
      `;
    }

    function renderTeacherRoom(){
      const r = state.room;
      if(!r) return `<div class="center muted" style="padding:60px 0;"><h3 style="margin-bottom:8px;">방 연결 중…</h3><p style="font-size:13px;">잠시만 기다려 주세요.</p></div>`;
      if(r.status==='waiting') return renderTeacherWaiting(r);
      if(r.status==='auction') return renderTeacherAuction(r);
      return renderTeacherEnded(r);
    }

    function renderTeacherWaiting(r){
      const studentsHtml = state.students.length
        ? state.students.map(s=>`<li class="participant"><span>${esc(s.name)}</span><span class="pill">예산 ${s.remainingBudget}</span></li>`).join('')
        : `<li class="muted" style="list-style:none;">아직 참여한 학생이 없어요.</li>`;

      const pending = state.proposals.filter(p=>p.status==='pending');
      const proposalsHtml = pending.length
        ? pending.map(p=>`
          <div class="proposal-card">
            <div class="proposal-head"><strong>${esc(p.valueName)}</strong><span class="pill wait">${esc(p.studentName)} 제안</span></div>
            <p class="muted" style="margin:4px 0 8px;">${esc(p.desc || '(설명 없음)')}</p>
            <div class="row">
              <button class="btn small gold" data-approve="${p.id}">목록에 추가</button>
              <button class="btn small secondary" data-reject="${p.id}">거절</button>
            </div>
          </div>
        `).join('')
        : `<p class="muted">아직 들어온 제안이 없어요.</p>`;

      const itemsHtml = (r.items || []).map((it,i)=>`<li class="muted" style="list-style:none; padding:4px 0;">${i+1}. <strong style="color:var(--ink)">${esc(it.name)}</strong> · 시작가 ${it.price}</li>`).join('');

      return `
      <div class="topbar">
        <span class="eyebrow">대기실 (방 코드: ${r.code})</span>
        <button class="linkbtn" data-go="teacher-menu">선생님 메뉴로 나가기</button>
      </div>
      <div class="center" style="margin-bottom:18px;">
        <p class="eyebrow">학생들에게 알려줄 방 코드</p>
        <div class="badge">${r.code}</div>
        <p class="muted" style="margin-top:10px;">이 방 코드는 유지되므로 메뉴를 나갔다 와도 다시 들어올 수 있습니다.</p>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h3 style="font-size:15px; margin-bottom:10px;">참여 학생 (<span id="teacherStudentCount">${state.students.length}명</span>)</h3>
        <ul class="list-plain" id="teacherStudentList">${studentsHtml}</ul>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h3 style="font-size:15px; margin-bottom:10px;">학생 제안 (<span id="teacherProposalCount">${state.proposals.length}/${r.maxProposals}</span>)</h3>
        <div class="stack" id="teacherProposalList">${proposalsHtml}</div>
      </div>

      <div class="card">
        <h3 style="font-size:15px; margin-bottom:8px;">경매 목록 (${(r.items || []).length}개)</h3>
        <ul style="padding:0; margin:0;" id="teacherAuctionListUl">${itemsHtml}</ul>
      </div>

      <button class="btn seal block" id="startAuctionBtn" style="margin-top:22px; padding:15px; font-size:16px;">경매 시작하기</button>
      `;
    }

    function renderTeacherAuction(r){
      const idx = r.currentIndex;
      const item = (r.items && r.items[idx]) ? r.items[idx] : { name:'가치', desc:'', price:50 };
      const b = state.bid;
      const status = b ? b.status : 'open';
      const historyHtml = (b && b.history && b.history.length)
        ? b.history.slice().reverse().slice(0,8).map(h=>`<div class="history-row"><span>${esc(h.name)}</span><span>${h.amount}</span></div>`).join('')
        : `<p class="muted" style="font-size:13px;">입찰 기록이 없습니다.</p>`;

      manageCountdownTicker(status, b);

      return `
      <div class="topbar">
        <span class="eyebrow">경매 진행 · 방 코드 ${r.code}</span>
        <button class="linkbtn" data-go="teacher-menu">선생님 메뉴</button>
      </div>

      <div class="auction-stage">
        <p class="eyebrow">지금 경매 중인 가치 (${idx+1} / ${r.items.length})</p>
        <div class="value-name">${esc(item.name)}</div>
        <div class="value-desc">${esc(item.desc)}</div>
        <div id="bidAreaDiv">${renderBidArea(b, item, status)}</div>
        <div class="row" style="justify-content:center;">${renderTeacherControls(b, status)}</div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:14px; margin-bottom:6px;">입찰 기록</h3>
        <div id="teacherHistoryDiv">${historyHtml}</div>
      </div>

      <button class="btn secondary block" id="nextItemBtn" style="margin-top:18px;">다음 가치로 넘어가기 →</button>
      `;
    }

    function renderBidArea(b, item, status){
      if(status==='countdown'){
        return `
          <div class="bid-display" style="justify-content:center;">
            <div class="center" style="width:100%;">
              <div style="font-size:12px; opacity:.8;">낙찰자 발표까지</div>
              <div class="amt" id="countdownNum" style="font-size:46px;">5</div>
            </div>
          </div>
        `;
      }
      if(status==='sold'){
        return `
          <div class="bid-display" style="background:var(--seal); justify-content:center;">
            <div class="center" style="width:100%;">
              <div style="font-size:12px; opacity:.85;">낙찰</div>
              <div class="amt" style="color:#fff1ec;">${esc(b.soldName || '')}</div>
              <div class="who" style="opacity:.9;">${b.soldPrice != null ? b.soldPrice + 'P' : ''}</div>
            </div>
          </div>
        `;
      }
      const highBid = b ? b.highBid : item.price;
      const who = b && b.highBidderName ? b.highBidderName : '입찰 없음';
      return `
        <div class="bid-display">
          <div>
            <div style="font-size:12px; opacity:.75;">현재 최고가</div>
            <div class="amt">${highBid}</div>
          </div>
          <div class="who">${esc(who)}</div>
        </div>
      `;
    }

    function renderTeacherControls(b, status){
      if(status==='countdown' || status==='sold') return '';
      return `
        <button class="btn gold" id="finalizeBtn" ${!(b && b.highBidderId)?'disabled':''}>낙찰 대기</button>
        <button class="btn secondary" id="skipBtn">유찰(패스)</button>
      `;
    }

    function renderTeacherEnded(r){
      let rows = '';
      let soldCount = 0, totalSpent = 0;
      state.students.forEach(s=>{
        if(s.won && s.won.length){
          s.won.forEach(w=>{
            rows += `<tr><td>${esc(s.name)}</td><td>${esc(w.name)}</td><td>${w.price}</td><td>${s.remainingBudget}</td></tr>`;
            soldCount++; totalSpent += w.price;
          });
        } else {
          rows += `<tr><td>${esc(s.name)}</td><td class="muted">낙찰 없음</td><td>—</td><td>${s.remainingBudget}</td></tr>`;
        }
      });

      return `
      <div class="topbar"><span class="eyebrow">경매 종료 · 방 ${r.code}</span><button class="linkbtn" data-go="teacher-menu">선생님 메뉴</button></div>
      <div class="celebrate-wrap">
        <h2>수고 많았어요! 🎉</h2>
        <p>모든 경매가 종료되었습니다.</p>
      </div>

      <div class="stat-row">
        <div class="stat-box"><div class="num">${state.students.length}</div><div class="lbl">참여 학생</div></div>
        <div class="stat-box"><div class="num">${soldCount}</div><div class="lbl">낙찰 건수</div></div>
        <div class="stat-box"><div class="num">${totalSpent}</div><div class="lbl">총 낙찰액</div></div>
      </div>

      <div class="card">
        <table class="results">
          <thead><tr><th>학생</th><th>낙찰 가치</th><th>낙찰가</th><th>남은 예산</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="muted">기록이 없습니다.</td></tr>'}</tbody>
        </table>
      </div>

      <div class="card" style="margin-top:18px;">
        <h3 style="font-size:15px; margin-bottom:8px;">구글 시트로 보내기</h3>
        <input type="text" id="webhookInput" placeholder="Apps Script 웹앱 URL (https://script.google.com/...)" value="${esc(state.webhookUrl)}">
        <button class="btn gold block" id="sendSheetBtn" style="margin-top:10px;">시트로 전송</button>
      </div>
      `;
    }

    function renderStudentJoin(){
      const session = JSON.parse(localStorage.getItem('auction_session') || '{}');
      const savedCode = (session.role === 'student' && session.roomCode) ? session.roomCode : '';
      const savedName = (session.role === 'student' && session.studentName) ? session.studentName : '';

      return `
      <div class="topbar"><button class="linkbtn" data-go="home">← 처음으로</button></div>
      <h2 style="margin-bottom:4px;">학생으로 참여하기</h2>
      <p class="muted" style="margin-bottom:18px;">선생님이 알려주신 방 코드와 이름을 입력하세요.</p>

      <div class="card stack">
        <div>
          <label class="field-label">방 코드</label>
          <input type="text" id="joinCode" inputmode="numeric" maxlength="4" placeholder="예: 4821" value="${esc(savedCode)}">
        </div>
        <div>
          <label class="field-label">이름</label>
          <input type="text" id="joinName" placeholder="이름을 입력하세요" maxlength="12" value="${esc(savedName)}">
        </div>
        <button class="btn gold block" id="joinBtn" style="padding:14px;">입장하기</button>
        <p class="muted" id="joinError" style="color:var(--seal); display:none;"></p>
      </div>
      `;
    }

    function renderStudentRoom(){
      const r = state.room;
      if(!r) return `<div class="center muted" style="padding:60px 0;"><h3 style="margin-bottom:8px;">대기실 입장 중…</h3><p style="font-size:13px;">잠시만 기다려 주세요.</p></div>`;
      if(r.status==='waiting') return renderStudentWaiting(r);
      if(r.status==='auction') return renderStudentAuction(r);
      return renderStudentEnded(r);
    }

    function renderStudentWaiting(r){
      const budget = state.myStudentData ? state.myStudentData.remainingBudget : r.budget;
      const myProposals = state.proposals.filter(p=>p.studentId===state.studentId);
      const myPropHtml = myProposals.length
        ? myProposals.map(p=>`<div class="proposal-card"><div class="proposal-head"><strong>${esc(p.valueName)}</strong><span class="pill ${p.status==='approved'?'ok':p.status==='rejected'?'no':'wait'}">${p.status==='approved'?'채택됨':p.status==='rejected'?'거절됨':'대기중'}</span></div></div>`).join('')
        : `<p class="muted" style="font-size:13px;">아직 제안한 가치가 없어요.</p>`;

      return `
      <div class="topbar"><span class="eyebrow">대기실 · 방 ${r.code}</span><span class="pill">${esc(state.studentName)}</span></div>
      <div class="budget-strip"><span>내 예산</span><b id="myBudgetNum">${budget}</b></div>

      <div class="card center" style="padding:26px 20px;">
        <p class="eyebrow">선생님이 경매를 시작하면</p>
        <h3 style="font-size:17px;">자동으로 경매 화면으로 이동합니다</h3>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:15px; margin-bottom:4px;">추가하고 싶은 가치가 있나요?</h3>
        <p class="muted" style="font-size:12.5px; margin-bottom:10px;">선생님이 승인하면 경매 목록에 추가됩니다.</p>
        <div class="stack" style="margin-top:10px;">
          <input type="text" id="proposeValueName" placeholder="가치 이름">
          <textarea id="proposeValueDesc" placeholder="설명" style="min-height:56px;"></textarea>
          <button class="btn secondary block" id="proposeBtn">제안하기</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:15px; margin-bottom:8px;">내가 제안한 가치</h3>
        <div class="stack" id="myProposalsList">${myPropHtml}</div>
      </div>
      `;
    }

    function renderStudentAuction(r){
      const idx = r.currentIndex;
      const item = (r.items && r.items[idx]) ? r.items[idx] : { name:'가치', desc:'', price:50 };
      const b = state.bid;
      const status = b ? b.status : 'open';
      const budget = state.myStudentData ? state.myStudentData.remainingBudget : 0;

      manageCountdownTicker(status, b);

      return `
      <div class="topbar"><span class="eyebrow">경매 중 · ${idx+1}/${r.items.length}</span><span class="pill">${esc(state.studentName)}</span></div>
      <div class="budget-strip"><span>내 남은 예산</span><b id="myBudgetNum">${budget}</b></div>

      <div class="auction-stage">
        <p class="eyebrow">지금 경매 중인 가치</p>
        <div class="value-name">${esc(item.name)}</div>
        <div class="value-desc">${esc(item.desc)}</div>
        <div id="bidAreaDiv">${renderBidArea(b, item, status)}</div>
        <div>${renderStudentBidControls(r, b, item, status)}</div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:14px; margin-bottom:6px;">내가 얻은 가치</h3>
        <div>${renderMyWon()}</div>
      </div>
      `;
    }

    function renderStudentBidControls(r, b, item, status){
      const maxItems = r.maxItems || 3;
      const me = state.myStudentData;
      if(me && me.won && me.won.length >= maxItems) return `<p class="muted center">최대 낙찰 개수에 도달했습니다.</p>`;
      if(status==='countdown') return `<p class="muted center">입찰이 마감되었습니다.</p>`;
      if(status==='sold') return `<p class="muted center">낙찰되었습니다.</p>`;
      const highBid = b ? b.highBid : item.price;
      return `
        <div class="stack" style="max-width:280px; margin:0 auto;">
          <input type="number" id="bidAmountInput" value="${highBid + 10}" min="${highBid+1}" max="${me ? me.remainingBudget : 0}">
          <div class="bid-quick">
            <button class="btn small secondary" data-quick="10">+10</button>
            <button class="btn small secondary" data-quick="50">+50</button>
            <button class="btn small secondary" data-quick="100">+100</button>
          </div>
          <button class="btn gold block" id="placeBidBtn">입찰하기</button>
          <p class="muted" id="bidError" style="color:var(--seal); display:none; font-size:12.5px;"></p>
        </div>
      `;
    }

    function renderMyWon(){
      const me = state.myStudentData;
      if(!me || !me.won || !me.won.length) return `<p class="muted" style="font-size:13px;">아직 낙찰받은 가치가 없어요.</p>`;
      return `<ul class="list-plain">${me.won.map(w=>`<li class="participant"><span>${esc(w.name)}</span><span class="pill">${w.price}</span></li>`).join('')}</ul>`;
    }

    function renderStudentEnded(r){
      return `
      <div class="topbar"><span class="eyebrow">경매 종료 · 방 ${r.code}</span></div>
      <div class="celebrate-wrap"><h2>수고했어요, ${esc(state.studentName)}님! 🎉</h2></div>
      <div class="card">
        <div class="budget-strip" style="margin-bottom:14px;"><span>남은 예산</span><b>${state.myStudentData ? state.myStudentData.remainingBudget : '-'}</b></div>
        ${renderMyWon()}
      </div>
      `;
    }

    /* ================= HANDLERS ================= */
    function attachProposalActionHandlers(){
      document.querySelectorAll('[data-approve]').forEach(el=>{
        el.onclick = async () => {
          try {
            const pid = el.getAttribute('data-approve');
            const p = state.proposals.find(x=>x.id===pid);
            if(!p) return;
            await db.collection("rooms").doc(state.roomCode).collection("proposals").doc(pid).update({ status:'approved' });
            const newItems = [...(state.room.items || []), {id:uid(), name:p.valueName || '', desc:p.desc || '', price:50}];
            await db.collection("rooms").doc(state.roomCode).update({ items: newItems });
            const listUl = document.getElementById('teacherAuctionListUl');
            if(listUl){
              listUl.innerHTML = newItems.map((it,i)=>`<li class="muted" style="list-style:none; padding:4px 0;">${i+1}. <strong style="color:var(--ink)">${esc(it.name)}</strong> · 시작가 ${it.price}</li>`).join('');
            }
            toast('가치 목록에 추가했어요.');
          } catch(err) {
            toast('승인 처리 실패: ' + err.message);
          }
        };
      });

      document.querySelectorAll('[data-reject]').forEach(el=>{
        el.onclick = async () => {
          try {
            const pid = el.getAttribute('data-reject');
            await db.collection("rooms").doc(state.roomCode).collection("proposals").doc(pid).update({ status:'rejected' });
          } catch(err) {
            toast('거절 처리 실패: ' + err.message);
          }
        };
      });
    }

    function attachHandlers(){
      document.querySelectorAll('[data-go]').forEach(el=>{
        el.onclick = () => {
          goto(el.getAttribute('data-go'));
        };
      });

      // 기존 방 이어하기
      const resumeRoomBtn = document.getElementById('resumeRoomBtn');
      if(resumeRoomBtn) resumeRoomBtn.onclick = async () => {
        const codeInput = (document.getElementById('resumeCodeInput')?.value || '').trim();
        const errEl = document.getElementById('resumeError');
        if(!codeInput) {
          if(errEl){ errEl.textContent = '방 코드를 입력해주세요.'; errEl.style.display = 'block'; }
          return;
        }
        resumeRoomBtn.disabled = true;
        resumeRoomBtn.textContent = '불러오는 중...';

        try {
          const rSnap = await db.collection("rooms").doc(codeInput).get();
          if(!rSnap.exists) {
            if(errEl){ errEl.textContent = '존재하지 않는 방 코드입니다.'; errEl.style.display = 'block'; }
            resumeRoomBtn.disabled = false;
            resumeRoomBtn.textContent = '방 이어하기';
            return;
          }

          state.roomCode = codeInput;
          state.role = 'teacher';
          state.room = rSnap.data();
          saveSession();
          bindRoomRealtime(codeInput);
          goto('teacher-room');
        } catch(err) {
          if(errEl){ errEl.textContent = '연결 실패: ' + err.message; errEl.style.display = 'block'; }
          resumeRoomBtn.disabled = false;
          resumeRoomBtn.textContent = '방 이어하기';
        }
      };

      const addItemBtn = document.getElementById('addItemBtn');
      if(addItemBtn) addItemBtn.onclick = () => {
        state.draftItems = collectDraftItemsFromDOM();
        state.draftItems.push({id:uid(), name:'', desc:'', price:50});
        render();
      };

      const resetBtn = document.getElementById('resetDefaultsBtn');
      if(resetBtn) resetBtn.onclick = () => {
        state.draftItems = DEFAULT_VALUES.map(v=>({id:uid(), name:v.name, desc:v.desc, price:v.price}));
        render();
      };

      document.querySelectorAll('[data-remove-item]').forEach(el=>{
        el.onclick = () => {
          const remId = el.getAttribute('data-remove-item');
          state.draftItems = collectDraftItemsFromDOM().filter(it=>it.id !== remId);
          render();
        };
      });

      // 새 방 만들기 (30종 가치 + 제안 20개 설정 적용)
      const createRoomBtn = document.getElementById('createRoomBtn');
      if(createRoomBtn) createRoomBtn.onclick = async () => {
        try {
          createRoomBtn.disabled = true;
          createRoomBtn.textContent = '새 방 생성 중...';

          const items = collectDraftItemsFromDOM();
          const code = roomCodeGen();
          const budget = parseInt(document.getElementById('budgetInput')?.value, 10) || 1000;
          const maxItems = parseInt(document.getElementById('maxItemsInput')?.value, 10) || 3;
          const maxProposals = parseInt(document.getElementById('maxProposalsInput')?.value, 10) || 20;
          
          const room = { 
            code: code, 
            status: 'waiting', 
            budget: budget, 
            maxProposals: maxProposals, 
            maxItems: maxItems, 
            items: items, 
            currentIndex: -1, 
            createdAt: Date.now() 
          };

          await db.collection("rooms").doc(code).set(room);

          state.roomCode = code;
          state.role = 'teacher';
          state.room = room;
          saveSession();

          bindRoomRealtime(code);
          goto('teacher-room');
        } catch (err) {
          console.error("방 만들기 오류:", err);
          alert("방 생성 실패: " + err.message);
          createRoomBtn.disabled = false;
          createRoomBtn.textContent = '새 방 만들기 (코드 생성)';
        }
      };

      attachProposalActionHandlers();

      // 경매 시작하기
      const startAuctionBtn = document.getElementById('startAuctionBtn');
      if(startAuctionBtn) startAuctionBtn.onclick = async () => {
        try {
          const firstItem = state.room.items[0] || { price: 50 };
          await db.collection("rooms").doc(state.roomCode).update({ status:'auction', currentIndex:0 });
          await db.collection("rooms").doc(state.roomCode).collection("bids").doc("0").set({
            itemIndex: 0, 
            highBid: firstItem.price, 
            highBidderId: '', 
            highBidderName: '', 
            history: [], 
            status: 'open', 
            countdownEndAt: 0, 
            soldName: '', 
            soldPrice: 0
          });
        } catch(err) {
          alert('경매 시작 실패: ' + err.message);
        }
      };

      // 낙찰 대기
      const finalizeBtn = document.getElementById('finalizeBtn');
      if(finalizeBtn) finalizeBtn.onclick = async () => {
        try {
          const idx = state.room.currentIndex;
          const b = state.bid;
          if(!b || !b.highBidderId) return;
          
          await db.collection("rooms").doc(state.roomCode).collection("bids").doc(String(idx)).update({
            status: 'countdown',
            countdownEndAt: Date.now() + 5000
          });

          setTimeout(async () => {
            const studentRef = db.collection("rooms").doc(state.roomCode).collection("students").doc(b.highBidderId);
            const sSnap = await studentRef.get();
            if(sSnap.exists){
              const s = sSnap.data();
              const item = state.room.items[idx];
              const newWon = s.won || [];
              newWon.push({itemId:item.id, name:item.name, price:b.highBid});
              await studentRef.update({
                remainingBudget: s.remainingBudget - b.highBid,
                won: newWon
              });
              await db.collection("rooms").doc(state.roomCode).collection("bids").doc(String(idx)).update({
                status: 'sold',
                soldName: s.name,
                soldPrice: b.highBid
              });
            }
          }, 5200);
        } catch(err) {
          toast('낙찰 처리 실패: ' + err.message);
        }
      };

      const skipBtn = document.getElementById('skipBtn');
      if(skipBtn) skipBtn.onclick = async () => { await advanceItem(); };

      const nextItemBtn = document.getElementById('nextItemBtn');
      if(nextItemBtn) nextItemBtn.onclick = async () => { await advanceItem(); };

      async function advanceItem() {
        try {
          const nextIdx = state.room.currentIndex + 1;
          if(nextIdx >= state.room.items.length){
            await db.collection("rooms").doc(state.roomCode).update({ status:'ended' });
          } else {
            const nextItem = state.room.items[nextIdx] || { price: 50 };
            await db.collection("rooms").doc(state.roomCode).update({ currentIndex: nextIdx });
            await db.collection("rooms").doc(state.roomCode).collection("bids").doc(String(nextIdx)).set({
              itemIndex: nextIdx, 
              highBid: nextItem.price, 
              highBidderId: '', 
              highBidderName: '', 
              history: [], 
              status: 'open', 
              countdownEndAt: 0, 
              soldName: '', 
              soldPrice: 0
            });
          }
        } catch(err) {
          alert('다음 항목 이동 실패: ' + err.message);
        }
      }

      // 학생 입장하기
      const joinBtn = document.getElementById('joinBtn');
      if(joinBtn) joinBtn.onclick = async () => {
        try {
          const code = (document.getElementById('joinCode')?.value || '').trim();
          const name = (document.getElementById('joinName')?.value || '').trim();
          const errEl = document.getElementById('joinError');
          if(!code || !name){ 
            if(errEl){ errEl.textContent='방 코드와 이름을 모두 입력해주세요.'; errEl.style.display='block'; }
            return; 
          }
          
          joinBtn.disabled = true;
          joinBtn.textContent = '입장 중...';

          const rSnap = await db.collection("rooms").doc(code).get();
          if(!rSnap.exists){
            if(errEl){ errEl.textContent='존재하지 않는 방입니다.'; errEl.style.display='block'; }
            joinBtn.disabled = false;
            joinBtn.textContent = '입장하기';
            return;
          }
          const r = rSnap.data();

          const studentsSnap = await db.collection("rooms").doc(code).collection("students").where("name", "==", name).get();
          let student = null;
          let sid = '';

          if(!studentsSnap.empty){
            const docData = studentsSnap.docs[0];
            sid = docData.id;
            student = docData.data();
          } else {
            sid = uid();
            student = {id:sid, name:name, budget:r.budget, remainingBudget:r.budget, won:[], joinedAt:Date.now()};
            await db.collection("rooms").doc(code).collection("students").doc(sid).set(student);
          }
          
          state.roomCode = code;
          state.studentId = sid;
          state.studentName = name;
          state.role = 'student';
          state.room = r;
          state.myStudentData = student;
          saveSession();

          bindRoomRealtime(code);
          goto('student-room');
        } catch(err) {
          console.error("입장 에러:", err);
          alert('입장 실패: ' + err.message);
          joinBtn.disabled = false;
          joinBtn.textContent = '입장하기';
        }
      };

      // 학생 제안하기
      const proposeBtn = document.getElementById('proposeBtn');
      if(proposeBtn) proposeBtn.onclick = async () => {
        try {
          const nameEl = document.getElementById('proposeValueName');
          const descEl = document.getElementById('proposeValueDesc');
          const vname = (nameEl?.value || '').trim();
          if(!vname){ toast('가치 이름을 입력해주세요.'); return; }
          const pid = uid();
          const p = {
            id: pid, 
            studentId: state.studentId, 
            studentName: state.studentName, 
            valueName: vname, 
            desc: (descEl?.value || '').trim(), 
            status: 'pending', 
            createdAt: Date.now()
          };
          await db.collection("rooms").doc(state.roomCode).collection("proposals").doc(pid).set(p);
          toast('선생님께 제안을 보냈어요.');
          if(nameEl) nameEl.value = '';
          if(descEl) descEl.value = '';
        } catch(err) {
          toast('제안 실패: ' + err.message);
        }
      };

      // 학생 입찰하기
      const placeBidBtn = document.getElementById('placeBidBtn');
      if(placeBidBtn) placeBidBtn.onclick = async () => {
        try {
          const amount = parseInt(document.getElementById('bidAmountInput')?.value, 10);
          const idx = state.room.currentIndex;
          const b = state.bid;
          const me = state.myStudentData;
          const errEl = document.getElementById('bidError');

          if(!amount || (b && amount <= b.highBid)){
            if(errEl){ errEl.textContent = '현재 최고가보다 높아야 합니다.'; errEl.style.display='block'; }
            return;
          }
          if(me && amount > me.remainingBudget){
            if(errEl){ errEl.textContent = '남은 예산보다 많습니다.'; errEl.style.display='block'; }
            return;
          }

          const history = (b && b.history) ? b.history : [];
          history.push({studentId:state.studentId, name:state.studentName, amount:amount, ts:Date.now()});

          await db.collection("rooms").doc(state.roomCode).collection("bids").doc(String(idx)).update({
            highBid: amount,
            highBidderId: state.studentId,
            highBidderName: state.studentName,
            history: history
          });
          toast('입찰을 완료했습니다!');
        } catch(err) {
          toast('입찰 실패: ' + err.message);
        }
      };

      document.querySelectorAll('[data-quick]').forEach(el=>{
        el.onclick = () => {
          const inc = parseInt(el.getAttribute('data-quick'),10);
          const input = document.getElementById('bidAmountInput');
          const base = state.bid ? state.bid.highBid : state.room.items[state.room.currentIndex].price;
          if(input) input.value = base + inc;
        };
      });

      const sendSheetBtn = document.getElementById('sendSheetBtn');
      if(sendSheetBtn) sendSheetBtn.onclick = async () => {
        const url = (document.getElementById('webhookInput')?.value || '').trim();
        if(!url){ toast('웹앱 URL을 입력해주세요.'); return; }
        sendSheetBtn.disabled = true; sendSheetBtn.textContent = '전송 중…';
        const results = [];
        state.students.forEach(s=>{
          if(s.won && s.won.length){
            s.won.forEach(w=> results.push({studentName:s.name, valueName:w.name, price:w.price, remainingBudget:s.remainingBudget}));
          } else {
            results.push({studentName:s.name, valueName:'', price:'', remainingBudget:s.remainingBudget});
          }
        });
        try{
          await fetch(url, {
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({roomCode: state.roomCode, timestamp: new Date().toLocaleString('ko-KR'), results})
          });
          toast('구글 시트로 전송을 완료했습니다!');
        }catch(e){
          toast('전송 실패. URL을 다시 확인해주세요.');
        }
        sendSheetBtn.disabled = false; sendSheetBtn.textContent = '시트로 전송';
      };
    }

    render();

  } catch (err) {
    console.error("초기화 오류:", err);
    document.getElementById('app').innerHTML = `
      <div class="card center" style="margin-top: 50px; border-color: var(--seal);">
        <h3 style="color: var(--seal); margin-bottom: 8px;">실행 중 오류가 발생했습니다</h3>
        <p class="muted" style="font-size: 13px;">${err.message || err}</p>
      </div>
    `;
  }
});
</script>
</body>
</html>
